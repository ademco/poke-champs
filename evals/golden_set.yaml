    must_include: ["Flutter Mane", "Booster Energy", "not"]
    must_not_include: ["100% legal", "10/10"]
    sources:
      - {source: showdown, ref: "data/mods/champions/formats-data.ts fluttermane (Illegal)"}
      - {source: showdown, ref: "data/mods/champions/items.ts boosterenergy (Past)"}
    auto_checks:
      - kind: team_legality
        args: {regulation: M-C, game_type: doubles}
        expected: ["species_illegal:Flutter Mane", "item_illegal:Booster Energy", "team_too_small:1"]

  - id: team-006
    category: team_analysis
    game_type: doubles
    regulation: M-C
    input: |
      Is this spread okay?

      Garchomp @ Life Orb
      Ability: Rough Skin
      EVs: 32 HP / 40 Atk / 32 Spe
      Jolly Nature
      - Dragon Claw
      - Earthquake
      - Rock Slide
      - Protect
    expected_behavior: correct
    expected_answer: >-
      No: 40 Atk is over the 32-per-stat cap and the total (104) is over the 66 SP
      limit. A legal max-offense spread is e.g. 32 Atk / 32 Spe / 2 HP.
    must_include: ["32", "66"]
    sources:
      - {source: showdown, ref: "sim/team-validator.ts (32 per stat)"}
      - {source: showdown, ref: "sim/dex-formats.ts (66 total)"}
    auto_checks:
      - kind: team_legality
        args: {regulation: M-C, game_type: doubles, ignore_team_size: true}
        expected: ["sp_stat_over_32:Garchomp:atk", "sp_total_over_66:Garchomp:104"]

  - id: team-007
    category: team_analysis
    game_type: doubles
    regulation: M-C
    input: "Does my Jolly 32-Speed Garchomp outspeed a Jolly 32-Speed Rillaboom? What about under the opponent's Tailwind?"
    expected_behavior: answer
    expected_answer: >-
      Without Tailwind: yes, Garchomp 169 vs Rillaboom 150. Under the opponent's
      Tailwind Rillaboom's Speed doubles to 300, so Rillaboom moves first. (Grassy
      Glide also has priority in Grassy Terrain.)
    must_include: ["169", "150", "300"]
    sources:
      - {source: showdown, ref: "data/pokedex.ts (garchomp 102, rillaboom 85 base Spe)"}
      - {source: showdown, ref: "data/mods/champions/scripts.ts statModify"}
    auto_checks:
      - kind: speed_compare
        args: {a: {species: Garchomp, sp: 32, nature: Jolly}, b: {species: Rillaboom, sp: 32, nature: Jolly}}
        expected: {a: 169, b: 150, faster: a}

  - id: team-008
    category: team_analysis
    game_type: doubles
    regulation: M-C
    input: "Does Jolly 32 Atk Garchomp's Earthquake OHKO a Careful 32 HP / 16 Def Incineroar?"
    expected_behavior: answer
    expected_answer: >-
      Damage range from the deterministic calc (spread 0.75x applies if both foes
      are hit; Intimidate matters). Must state the % range and KO chance from the
      tool, never an estimate.
    sources:
      - {source: smogon_calc, ref: "fixture generated from @smogon/calc Champions mode"}
    auto_checks:
      - kind: damage_range
        args:
          attacker: {species: Garchomp, nature: Jolly, sp: {atk: 32, spe: 32, hp: 2}}
          defender: {species: Incineroar, nature: Careful, sp: {hp: 32, def: 16, spd: 16, atk: 2}}
          move: Earthquake
          spread: false
    notes: "expected filled from the @smogon/calc fixture in phase 2."

  - id: team-009
    category: team_analysis
    game_type: doubles
    regulation: M-C
    input: "In Trick Room, does a Brave 0-Speed Kingambit move before a 0-Speed Incineroar with a neutral nature?"
    expected_behavior: answer
    expected_answer: >-
      Yes. Kingambit: (50 + 0 + 20) x 0.9 = 63. Incineroar: 60 + 0 + 20 = 80.
      Under Trick Room the slower Pokémon moves first, so Kingambit (63) goes first.
