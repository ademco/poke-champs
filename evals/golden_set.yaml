# PokéChamp golden set: the fixed exam every phase is graded against.
#
# Rules for editing:
# - Every fact in expected_answer must come from a source in `sources`. Facts
#   marked "Showdown" were read from Pokémon Showdown's code/data on verified_on.
# - expected: null in an auto_check means "computed at eval time" (usage stats
#   change monthly; damage comes from an @smogon/calc fixture).
# - Teams use Showdown export format. In Champions, the "EVs:" line holds Stat
#   Points (0-32 per stat, 66 total) - Showdown reuses the EV field for SP.
# - Stat formula (Showdown data/mods/champions/scripts.ts, level 50):
#     HP = base + SP + 75;  other = floor((base + SP + 20) * nature)
version: 1
verified_on: "2026-10-08"
cases:
  # ───────────────────────── MECHANICS ─────────────────────────
  - id: mech-001
    category: mechanics
    game_type: any
    regulation: M-C
    input: "How do stat points work in Pokémon Champions?"
    expected_behavior: answer
    expected_answer: >-
      Champions replaces EVs with Stat Points (SP): 66 SP total per Pokémon, at
      most 32 in any one stat. IVs are fixed at 31 (perfect) and battles are at
      level 50. Each SP adds 1 point to the stat before the nature multiplier
      (HP = base + SP + 75; other stats = (base + SP + 20) x nature).
    must_include: ["66", "32", "IVs"]
    must_not_include: ["510", "252"]
    sources:
      - {source: showdown, ref: "sim/dex-formats.ts (evLimit = 66 for champions mods)"}
      - {source: showdown, ref: "sim/team-validator.ts (max 32 Stat Points per stat; IVs must be 31)"}
      - {source: showdown, ref: "data/mods/champions/scripts.ts statModify"}
    auto_checks: []

  - id: mech-002
    category: mechanics
    game_type: any
    regulation: M-C
    input: "What is Garchomp's Speed stat with a Jolly nature and 32 SP in Speed?"
    expected_behavior: answer
    expected_answer: "169. (102 base + 32 SP + 20) = 154, x1.1 Jolly = 169.4, rounded down to 169."
    must_include: ["169"]
    sources:
      - {source: showdown, ref: "data/pokedex.ts garchomp (base Spe 102)"}
      - {source: showdown, ref: "data/mods/champions/scripts.ts statModify"}
    auto_checks:
      - kind: stat
        args: {species: Garchomp, stat: spe, sp: 32, nature: Jolly}
        expected: 169

  - id: mech-003
    category: mechanics
    game_type: any
    regulation: M-C
    input: "How much HP does Incineroar have with 32 SP in HP?"
    expected_behavior: answer
    expected_answer: "202 HP (95 base + 32 SP + 75). Natures never affect HP."
    must_include: ["202"]
    sources:
      - {source: showdown, ref: "data/pokedex.ts incineroar (base HP 95)"}
      - {source: showdown, ref: "data/mods/champions/scripts.ts statModify"}
    auto_checks:
      - kind: stat
        args: {species: Incineroar, stat: hp, sp: 32, nature: Careful}
        expected: 202

  - id: mech-004
    category: mechanics
    game_type: any
    regulation: M-C
    input: "How does paralysis work in Champions? Is it the same as Scarlet/Violet?"
    expected_behavior: answer
    expected_answer: >-
      Paralysis still halves Speed, but the chance to be fully paralyzed each turn
      is 1/8 (12.5%) in Champions instead of 1/4 (25%) in Scarlet/Violet.
    must_include: ["12.5%", "Speed"]
    must_not_include: ["25% chance to be fully paralyzed in Champions"]
    sources:
      - {source: showdown, ref: "data/mods/champions/conditions.ts par (randomChance 1/8)"}
      - {source: showdown, ref: "data/conditions.ts par (mainline 1/4, Speed halved)"}

  - id: mech-005
    category: mechanics
    game_type: any
    regulation: M-C
    input: "How long does sleep last in Pokémon Champions?"
    expected_behavior: answer
    expected_answer: >-
      A sleeping Pokémon misses 1 or 2 turns: 1/3 chance it wakes on its second
      turn, otherwise it wakes on its third. Mainline Scarlet/Violet is 1-3 turns.
    must_include: ["1", "2"]
    sources:
      - {source: showdown, ref: "data/mods/champions/conditions.ts slp (startTime sample [2,3,3])"}
    notes: "Turn semantics follow Showdown's time-- before each move attempt."

  - id: mech-006
    category: mechanics
    game_type: any
    regulation: M-C
    input: "Can a Pokémon stay frozen forever in Champions?"
    expected_behavior: answer
    expected_answer: >-
      No. Each turn a frozen Pokémon has a 25% chance to thaw, and it is
      guaranteed to thaw on its third turn, so it misses at most 2 turns.
      (Mainline: 20% per turn with no guaranteed thaw.)
    must_include: ["25%", "third"]
    sources:
      - {source: showdown, ref: "data/mods/champions/conditions.ts frz"}

  - id: mech-007
    category: mechanics
    game_type: any
    regulation: M-C
    input: "How many Pokémon do I bring and pick in ranked doubles vs singles?"
    expected_behavior: answer
    expected_answer: >-
      Both formats are bring 6 with open team preview, at level 50. Doubles
      (VGC): pick 4. Singles (Battle Stadium Singles): pick 3. Species Clause
      and Item Clause apply.
    must_include: ["6", "4", "3"]
    sources:
      - {source: showdown, ref: "data/mods/champions/rulesets.ts flatrules"}
      - {source: showdown, ref: "sim/dex-formats.ts (Picked Team Size = Auto: doubles 4, else 3)"}

  - id: mech-008
    category: mechanics
    game_type: doubles
    regulation: M-C
    input: "How much damage do spread moves like Earthquake or Rock Slide do when they hit both opponents?"
    expected_behavior: answer
    expected_answer: "Each target takes 0.75x damage when a spread move hits more than one target."
    must_include: ["0.75"]
    sources:
      - {source: showdown, ref: "data/mods/champions/scripts.ts modifyDamage (spreadModifier 0.75)"}

  - id: mech-009
    category: mechanics
    game_type: any
    regulation: M-C
    input: "What changes when Garchomp Mega Evolves with Garchompite Z?"
    expected_behavior: answer
    expected_answer: >-
      It becomes Garchomp-Mega-Z: pure Dragon type (loses Ground), ability
      Levitate, base stats 108/130/85/141/85/151. Legal in M-C. (Regular
      Garchompite gives Garchomp-Mega instead.)
    must_include: ["Dragon", "Levitate", "151"]
    sources:
      - {source: showdown, ref: "data/pokedex.ts garchompmegaz"}
      - {source: showdown, ref: "data/items.ts garchompitez"}
      - {source: showdown, ref: "data/mods/champions/formats-data.ts garchompmegaz"}
    auto_checks:
      - kind: pokemon_legal
        args: {species: Garchomp-Mega-Z, regulation: M-C}
        expected: true

  - id: mech-010
    category: mechanics
    game_type: any
    regulation: M-C
    input: "What's Psyshield Bash's base power in Champions?"
    expected_behavior: answer
    expected_answer: "90 base power in Champions (70 in Scarlet/Violet)."
    must_include: ["90"]
    sources:
      - {source: showdown, ref: "data/mods/champions/moves.ts psyshieldbash"}

  - id: mech-011
    category: mechanics
    game_type: any
    regulation: M-C
    input: "Can I use Rillaboom in ranked right now? What does its ability do for doubles?"
    expected_behavior: answer
    expected_answer: >-
      Yes, Rillaboom is legal in the current regulation (M-C). Its hidden
      ability Grassy Surge sets Grassy Terrain on switch-in, which powers up
      Grass moves and lets Grassy Glide move first.
    must_include: ["M-C", "Grassy Surge"]
    sources:
      - {source: showdown, ref: "data/mods/champions/formats-data.ts rillaboom"}
      - {source: showdown, ref: "data/pokedex.ts rillaboom (abilities)"}
    auto_checks:
      - kind: pokemon_legal
        args: {species: Rillaboom, regulation: M-C}
        expected: true

  - id: mech-012
    category: mechanics
    game_type: singles
    regulation: M-C
    input: "In singles, is my Earthquake weaker because it's a spread move?"
    expected_behavior: answer
    expected_answer: >-
      No. The 0.75x spread reduction only applies when a move actually hits more
      than one target. In singles there is only one opponent, so Earthquake does
      full damage.
    must_include: ["0.75", "one target"]
    sources:
      - {source: showdown, ref: "data/mods/champions/scripts.ts modifyDamage (move.spreadHit)"}

  # ───────────────────────── META (expected computed from usage data) ─────────
  - id: meta-001
    category: meta
    game_type: doubles
    regulation: M-C
    input: "What are the most common Garchomp sets this regulation?"
    expected_behavior: answer
    expected_answer: >-
      Top items, moves, abilities and SP spreads for Garchomp from the latest M-C
      doubles usage data, with the month and source named.
    must_include: ["M-C"]
    sources:
      - {source: smogon_stats, ref: "chaos/{latest}/gen9championsvgc2026regmc"}
    auto_checks:
      - kind: usage_top
        args: {species: Garchomp, field: items, n: 3, format: gen9championsvgc2026regmc}

  - id: meta-002
    category: meta
    game_type: doubles
    regulation: M-C
    input: "What are the top 10 most used Pokémon in Champions doubles right now?"
    expected_behavior: answer
    expected_answer: "Top 10 by usage % from the latest M-C doubles usage data, with month and source."
    sources:
      - {source: smogon_stats, ref: "chaos/{latest}/gen9championsvgc2026regmc"}
    auto_checks:
      - kind: usage_top
        args: {field: species, n: 10, format: gen9championsvgc2026regmc}

