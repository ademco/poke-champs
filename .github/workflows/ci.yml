name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Same image as docker-compose.yml, so CI tests what runs locally.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: pokechamp
          POSTGRES_PASSWORD: pokechamp
          POSTGRES_DB: pokechamp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pokechamp"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://pokechamp:pokechamp@localhost:5432/pokechamp
      REQUIRE_DB: "1"  # DB tests must run in CI, never silently skip
      REQUIRE_MODEL: "1"  # likewise for the embedding-model tests
      POKECHAMP_MODEL_CACHE: /home/runner/.cache/pokechamp/models
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # The bge-small model (~130 MB) downloads once, then comes from cache.
      - uses: actions/cache@v6
        with:
          path: /home/runner/.cache/pokechamp/models
          key: embed-model-bge-small-en-v1.5-fastembed-0.9.0

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest

      # End-to-end smoke test: what `make demo` does on a laptop.
      - name: Migrate, load, run golden-set checks
        run: |
          python -m pokechamp.db.migrate
          python -m pokechamp.ingest.load_showdown
          python -m pokechamp.evals.auto_checks

      # Index with the real model and record peak memory (8 GB Mac budget).
      - name: Build the RAG index (real embeddings) and measure memory
        run: |
          /usr/bin/time -v python -m pokechamp.rag.index 2> time.log
          grep -E "Maximum resident set size|Elapsed \(wall clock\)" time.log
          python -m pokechamp.rag.search -k 3 "How long does sleep last in Champions?"
