[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pokechamp"
version = "0.0.1"
description = "Grounded RAG + agent assistant for Pokémon Champions (VGC 2026)"
requires-python = ">=3.12"
# Exact pins: reproducible CI. Versions checked with `pip index versions` on 2026-10-08.
dependencies = [
    "anthropic==1.12.1",  # Claude API SDK (phase 5+); only called when ANTHROPIC_API_KEY is set
    "fastembed==0.9.0",
    "flask==3.1.3",  # web app + REST API (MVP)  # local embeddings via ONNX runtime; no PyTorch (~180 MB installed)
    "numpy==2.5.3",
    "pgvector==0.5.0",  # psycopg adapter for the vector type
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokechamp = ["db/migrations/*.sql", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: needs a running Postgres (DATABASE_URL); skipped if unreachable",
    "model: needs the bge-small embedding model download; skipped if unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors; I: import order; B: likely bugs; UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# One team per line reads better than wrapped data.
"tools/showdown_export/build_legality_teams.py" = ["E501"]
